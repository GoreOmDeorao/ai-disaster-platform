name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: [backend/**]
  pull_request:
    branches: [main]
    paths: [backend/**]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go 1.21
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        working-directory: backend
        run: go mod download

      - name: Build backend
        working-directory: backend
        run: CGO_ENABLED=0 GOOS=linux go build -o disaster-backend ./cmd/server/

      - name: Verify build artifact
        working-directory: backend
        run: ls -lh disaster-backend

      - name: Run go vet
        working-directory: backend
        run: go vet ./...

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend/disaster-backend
          retention-days: 7
