global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'disaster-backend'
    static_configs:
      - targets: ['disaster_backend:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'disaster-ml'
    static_configs:
      - targets: ['disaster_ml:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'kafka'
    static_configs:
      - targets: ['disaster_kafka:9092']
    scrape_interval: 30s

  - job_name: 'postgres'
    static_configs:
      - targets: ['disaster_postgres:5432']
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['disaster_redis:6379']
    scrape_interval: 15s
