apiVersion: apps/v1
kind: Deployment
metadata:
  name: disaster-ml
  namespace: disaster-platform
  labels:
    app: disaster-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: disaster-ml
  template:
    metadata:
      labels:
        app: disaster-ml
    spec:
      containers:
        - name: ml-service
          image: 010526266021.dkr.ecr.ap-south-1.amazonaws.com/disaster-ml:latest
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: disaster-platform
spec:
  selector:
    app: disaster-ml
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
